name: Set up the workspace
description: Pinned Node and pnpm with the repository supply-chain policy
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0, Node 24
      with:
        version: 11.19.0
        package_json_file: WorkCard-Lifecycle/package.json
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
      with:
        node-version-file: WorkCard-Lifecycle/.node-version
        cache: pnpm
        cache-dependency-path: WorkCard-Lifecycle/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: WorkCard-Lifecycle
