name: Promote exact GHCR digest to Render
run-name: Work Card ${{ inputs.operation }} ${{ inputs.release_sha || github.sha }}
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PROMOTE EXACT DIGEST
        required: true
        type: string
      release_sha:
        description: Full published SHA; empty uses dispatched main SHA
        required: false
        type: string
      operation:
        description: Bootstrap only for initial synthetic demo; release preserves reset age
        required: true
        default: release
        type: choice
        options:
          - release
          - bootstrap
permissions: {}
concurrency:
  group: work-card-owner-and-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
    working-directory: WorkCard-Lifecycle
jobs:
  preflight:
    name: Verify durable published candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      image: ${{ steps.candidate.outputs.image }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-workspace
      - name: Verify manual main source and same-SHA CI/release evidence
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main ]]
          [[ "$CONFIRMATION" == 'PROMOTE EXACT DIGEST' && "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          image="$(node scripts/release/fetch-release.mjs "$RELEASE_SHA")"
          docker pull --platform linux/amd64 "$image"
          docker image inspect "$image" | jq -e --arg sha "$RELEASE_SHA" '.[0] | .Os == "linux" and .Architecture == "amd64" and .Config.Labels["org.opencontainers.image.revision"] == $sha' >/dev/null
          container="$(docker create "$image")"
          docker cp "$container:/opt/work-card/migrations" .quality-results/image-migrations
          docker rm "$container"
          node scripts/release/verify-image-migrations.mjs "docs/release/manifests/${RELEASE_SHA}.json" .quality-results/image-migrations
          {
            echo "sha=$RELEASE_SHA"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate
          path: WorkCard-Lifecycle/docs/release/manifests/${{ steps.candidate.outputs.sha }}.json
          if-no-files-found: error
          retention-days: 3

  staging_owner:
    name: Prepare isolated Neon staging with owner-only container
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging-owner
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Execute fixed owner preparation and verified reset
        env:
          IMAGE: ${{ needs.preflight.outputs.image }}
          OPERATION: ${{ inputs.operation }}
          APP_ENV: staging
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          APP_DATABASE_USER: ${{ vars.APP_DATABASE_USER }}
          APP_DATABASE_PASSWORD: ${{ secrets.APP_DATABASE_PASSWORD }}
          NEON_DATABASE_HOST: ${{ vars.NEON_DATABASE_HOST }}
          NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          PRODUCTION_NEON_HOST: ${{ vars.PRODUCTION_NEON_HOST }}
        run: |
          set -euo pipefail
          [[ "$NEON_DATABASE_HOST" != "$PRODUCTION_NEON_HOST" && -n "$PRODUCTION_NEON_HOST" ]]
          [[ "$OPERATION" == bootstrap || "$OPERATION" == release ]]
          docker pull --platform linux/amd64 "$IMAGE"
          if [[ "$OPERATION" == bootstrap ]]; then
            owner_command=(node dist/owner-maintenance.js bootstrap)
          else
            owner_command=(node dist/migrate.js)
          fi
          timeout --signal=TERM --kill-after=30s 600s docker run --rm --init \
            -e APP_ENV -e MIGRATION_DATABASE_URL -e APP_DATABASE_USER -e APP_DATABASE_PASSWORD \
            -e NEON_DATABASE_HOST -e NEON_DATABASE_NAME "$IMAGE" "${owner_command[@]}"
          timeout --signal=TERM --kill-after=30s 600s docker run --rm --init \
            -e APP_ENV -e MIGRATION_DATABASE_URL -e NEON_DATABASE_HOST -e NEON_DATABASE_NAME \
            "$IMAGE" node dist/owner-maintenance.js reset

  staging:
    name: Temporary Docker staging and canonical browser without owner secrets
    needs: [preflight, staging_owner]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging-runtime
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate
          path: WorkCard-Lifecycle/docs/release/manifests
      - name: Start exact image with runtime-only credentials
        env:
          IMAGE: ${{ needs.preflight.outputs.image }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SIGNING_SECRET: ${{ secrets.SESSION_SIGNING_SECRET }}
          NEON_DATABASE_HOST: ${{ vars.NEON_DATABASE_HOST }}
          NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
        run: |
          set -euo pipefail
          docker run --detach --name work-card-staging --init --publish 127.0.0.1:3000:3000 \
            -e APP_ENV=staging -e APP_ORIGIN=http://127.0.0.1:3000 -e HOST=0.0.0.0 -e PORT=3000 -e PROXY_TRUST_MODE=none \
            -e DATABASE_URL -e SESSION_SIGNING_SECRET -e NEON_DATABASE_HOST -e NEON_DATABASE_NAME "$IMAGE"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Run complete canonical public browser and security probes
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          node scripts/release/public-smoke.mjs "docs/release/manifests/${SOURCE_SHA}.json" \
            http://127.0.0.1:3000 local .quality-results/staging-smoke.json
      - name: Remove temporary runtime
        if: always()
        run: docker rm --force work-card-staging || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-evidence
          path: WorkCard-Lifecycle/.quality-results/staging-smoke.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  production_owner:
    name: Owner preparation for verified production digest
    needs: [preflight, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-owner
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Execute fixed production owner command
        env:
          IMAGE: ${{ needs.preflight.outputs.image }}
          OPERATION: ${{ inputs.operation }}
          APP_ENV: production
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          APP_DATABASE_USER: ${{ vars.APP_DATABASE_USER }}
          APP_DATABASE_PASSWORD: ${{ secrets.APP_DATABASE_PASSWORD }}
          NEON_DATABASE_HOST: ${{ vars.NEON_DATABASE_HOST }}
          NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          STAGING_NEON_HOST: ${{ vars.STAGING_NEON_HOST }}
        run: |
          set -euo pipefail
          [[ "$NEON_DATABASE_HOST" != "$STAGING_NEON_HOST" && -n "$STAGING_NEON_HOST" ]]
          [[ "$OPERATION" == bootstrap || "$OPERATION" == release ]]
          docker pull --platform linux/amd64 "$IMAGE"
          timeout --signal=TERM --kill-after=30s 600s docker run --rm --init \
            -e APP_ENV -e MIGRATION_DATABASE_URL -e APP_DATABASE_USER -e APP_DATABASE_PASSWORD \
            -e NEON_DATABASE_HOST -e NEON_DATABASE_NAME "$IMAGE" node dist/owner-maintenance.js "$OPERATION"

  deploy:
    name: Update persistent Render reference and verify resolved digest
    needs: [preflight, staging, production_owner]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
    outputs:
      origin: ${{ steps.deployment.outputs.origin }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate
          path: WorkCard-Lifecycle/docs/release/manifests
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: staging-evidence
          path: WorkCard-Lifecycle/.quality-results
      - name: Patch, read back, trigger, poll and verify Render deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVIDENCE_DURABLE: "1"
          CONFIGURATION_REVISION: ${{ vars.CONFIGURATION_REVISION }}
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          RENDER_ORIGIN: ${{ vars.RENDER_ORIGIN }}
        run: |
          set -euo pipefail
          node scripts/release/render-adapter.mjs "docs/release/manifests/${SOURCE_SHA}.json" .quality-results/render-deployment.json
          printf 'origin=%s\n' "$RENDER_ORIGIN" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: render-deployment
          path: WorkCard-Lifecycle/.quality-results/render-deployment.json*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  smoke:
    name: Public Render smoke without database or provider credentials
    needs: [preflight, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate
          path: WorkCard-Lifecycle/docs/release/manifests
      - name: Run HTTPS, session, CSRF, Origin, spoof and canonical browser probes
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
          RENDER_ORIGIN: ${{ needs.deploy.outputs.origin }}
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          node scripts/release/public-smoke.mjs "docs/release/manifests/${SOURCE_SHA}.json" \
            "$RENDER_ORIGIN" render .quality-results/render-smoke.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: render-smoke
          path: WorkCard-Lifecycle/.quality-results/render-smoke.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  evidence:
    name: Verify hosted proxy observations and retain append-only release evidence
    needs: [preflight, staging, deploy, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-workspace
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: candidate
          path: WorkCard-Lifecycle/docs/release/manifests
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: "*-evidence"
          merge-multiple: true
          path: WorkCard-Lifecycle/.quality-results
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: render-*
          merge-multiple: true
          path: WorkCard-Lifecycle/.quality-results
      - name: Validate actual Render logs and proxy chain
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          PROXY_TRUSTED_CIDRS: ${{ vars.PROXY_TRUSTED_CIDRS }}
        run: node scripts/release/render-observations.mjs .quality-results/render-smoke.json .quality-results/render-observations.json
      - name: Append and permanently retain release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.preflight.outputs.sha }}
          CONFIGURATION_REVISION: ${{ vars.CONFIGURATION_REVISION }}
        run: |
          set -euo pipefail
          node scripts/release/retain-evidence.mjs "$SOURCE_SHA"
