name: Release image

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Original failed run after first GHCR publication; reuses its digest without rebuilding
        required: false
        type: string

permissions: {}

concurrency:
  group: work-card-release-image
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: WorkCard-Lifecycle

jobs:
  preflight:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ci-run-url: ${{ steps.candidate.outputs.ci-run-url }}
      source-sha: ${{ steps.source.outputs.source-sha }}
    steps:
      - name: Checkout the dispatched revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate the source revision
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || {
            echo "Release image accepts only an explicit workflow_dispatch." >&2
            exit 1
          }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Release image must be dispatched from refs/heads/main." >&2
            exit 1
          }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "github.sha is not a full lowercase commit SHA." >&2
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || {
            echo "The checked-out commit does not match github.sha." >&2
            exit 1
          }
          [[ -z "$(git status --porcelain --untracked-files=all)" ]] || {
            echo "Release build requires a clean checkout." >&2
            exit 1
          }

          echo "source-sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Require the complete successful push CI for the same SHA
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source-sha }}
        run: |
          set -euo pipefail

          runs_json="$(gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f head_sha="$SOURCE_SHA" \
            -f per_page=20)"

          ci_run_id="$(jq -er --arg sha "$SOURCE_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success")][0].id' \
            <<<"$runs_json")"
          ci_run_url="$(jq -er --argjson id "$ci_run_id" \
            '.workflow_runs[] | select(.id == $id) | .html_url' \
            <<<"$runs_json")"
          jobs_json="$(gh api --method GET \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}/jobs" \
            -f filter=latest \
            -f per_page=100)"

          required_jobs=(
            "Code and database quality"
            "Clean container startup"
            "Dependency and secret security"
            "Browser (compact)"
            "Browser (canonical)"
            "Representative performance profile"
            "Release and IaC contract"
          )
          for required_job in "${required_jobs[@]}"; do
            jq -e --arg name "$required_job" \
              '[.jobs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length == 1' \
              <<<"$jobs_json" >/dev/null || {
              echo "Required CI job is not uniquely successful: $required_job" >&2
              exit 1
            }
          done

          echo "ci-run-url=$ci_run_url" >> "$GITHUB_OUTPUT"

  publish:
    name: Build once, publish public GHCR digest, scan and retain
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      SOURCE_SHA: ${{ needs.preflight.outputs.source-sha }}
      SOURCE_CI_RUN_URL: ${{ needs.preflight.outputs.ci-run-url }}
      TRIVY_IMAGE: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.source-sha }}
      - uses: ./.github/actions/setup-workspace
      - name: Authenticate publisher and reject any previously published source tag
        if: inputs.resume_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}/work-card"
          image_tag="${image_repository}:${SOURCE_SHA}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image_tag" > "$RUNNER_TEMP/existing-image.json" 2> "$RUNNER_TEMP/manifest-error"; then
            echo "This source SHA already has an image; promotion must reuse its recorded digest." >&2
            exit 1
          fi
          grep -Eiq 'manifest unknown|no such manifest|not found' "$RUNNER_TEMP/manifest-error" || {
            echo "Cannot prove the source tag is absent; refusing a rebuild." >&2
            exit 1
          }
          {
            echo "IMAGE_REPOSITORY=$image_repository"
            echo "IMAGE_TAG=$image_tag"
            echo "BUILD_SCAN_RUN_URL=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"
      - name: Build the release image exactly once
        if: inputs.resume_run_id == ''
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --pull --no-cache --build-arg "APP_VERSION=$SOURCE_SHA" --tag "$IMAGE_TAG" .
          docker save "$IMAGE_TAG" --output "$RUNNER_TEMP/built-image.tar"
          image_config_digest="$(node scripts/release/verify-image-config.mjs "$RUNNER_TEMP/built-image.tar" "$SOURCE_SHA")"
          echo "LOCAL_IMAGE_CONFIG_DIGEST=$image_config_digest" >> "$GITHUB_ENV"
      - name: Push source tag and resolve digest
        if: inputs.resume_run_id == ''
        run: |
          set -euo pipefail
          mkdir -p .quality-results/release
          docker push "$IMAGE_TAG"
          docker pull --platform linux/amd64 "$IMAGE_TAG"
          immutable_image="$(docker image inspect "$IMAGE_TAG" | jq -er --arg repository "$IMAGE_REPOSITORY" '.[0].RepoDigests | map(select(startswith($repository + "@sha256:"))) | unique | select(length == 1) | .[0]')"
          image_digest="${immutable_image##*@}"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "IMMUTABLE_IMAGE=$immutable_image"
            echo "IMAGE_DIGEST=$image_digest"
            echo "SOURCE_BUILD_RUN_URL=$BUILD_SCAN_RUN_URL"
          } >> "$GITHUB_ENV"
          jq -n --arg sha "$SOURCE_SHA" --arg image "$immutable_image" --arg config "$LOCAL_IMAGE_CONFIG_DIGEST" --arg run "$BUILD_SCAN_RUN_URL" '{sourceSha:$sha, immutableImage:$image, imageConfigDigest:$config, sourceBuildRunUrl:$run}' > .quality-results/release/published-identity.json
      - name: Retain original publication identity before anonymous pull
        if: inputs.resume_run_id == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-identity-${{ needs.preflight.outputs.source-sha }}-${{ github.run_attempt }}
          path: WorkCard-Lifecycle/.quality-results/release/published-identity.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Resume the originally built digest after public visibility is configured
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: node scripts/release/resume-publication.mjs
      - name: Prove anonymous public pull and exact image identity
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-docker" .quality-results/release
          docker --config "$RUNNER_TEMP/public-docker" pull --platform linux/amd64 "$IMMUTABLE_IMAGE"
          docker image inspect "$IMMUTABLE_IMAGE" | jq -e --arg sha "$SOURCE_SHA" '
            .[0] | .Os == "linux" and .Architecture == "amd64" and
            .Config.Labels["org.opencontainers.image.revision"] == $sha and
            ([.Config.Env[] | select(startswith("APP_VERSION="))] == ["APP_VERSION=" + $sha]) and
            (.Config.User != "" and .Config.User != "root" and .Config.User != "0")' >/dev/null
          docker save "$IMMUTABLE_IMAGE" --output .quality-results/release/published-image.tar
          node scripts/release/verify-image-config.mjs .quality-results/release/published-image.tar "$SOURCE_SHA" "$LOCAL_IMAGE_CONFIG_DIGEST"
      - name: Scan the pulled published digest
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/.quality-results/release:/scan" "$TRIVY_IMAGE" image \
            --input /scan/published-image.tar --scanners vuln --parallel 1 --no-progress \
            --severity HIGH,CRITICAL --exit-code 1 --format json --output /scan/image-vulnerabilities.json
      - name: Generate and validate versioned release manifest and migration checksums
        run: |
          set -euo pipefail
          node scripts/release/create-release-manifest.mjs \
            --source-sha "$SOURCE_SHA" --image-tag "$IMAGE_TAG" --image-digest "$IMAGE_DIGEST" \
            --image-config-digest "$LOCAL_IMAGE_CONFIG_DIGEST" --oci-revision-label "$SOURCE_SHA" \
            --source-ci-run-url "$SOURCE_CI_RUN_URL" --build-scan-run-url "$BUILD_SCAN_RUN_URL" \
            --source-build-run-url "$SOURCE_BUILD_RUN_URL" \
            --scanner-image "$TRIVY_IMAGE" --generated-at "$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/release/validate-release-manifest.mjs --manifest "docs/release/manifests/${SOURCE_SHA}.json" --scan-report .quality-results/release/image-vulnerabilities.json
          tar -czf "$RUNNER_TEMP/release-record.tar.gz" \
            "docs/release/manifests/${SOURCE_SHA}.json" docs/release/release-manifest.v2.schema.json \
            docs/release/release-evidence.v2.schema.json .quality-results/release/image-vulnerabilities.json
          sha256sum "$RUNNER_TEMP/release-record.tar.gz" | awk '{print $1 "  release-record.tar.gz"}' > "$RUNNER_TEMP/release-record.sha256"
      - name: Retain immutable release records for service lifetime and rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Releases and GHCR versions have no automatic retention/deletion policy here.
          # Do not add --clobber: an existing record is immutable evidence.
          gh release create "work-card-${SOURCE_SHA}" --target "$SOURCE_SHA" \
            --title "Work Card ${SOURCE_SHA}" --notes "Public GHCR image and validated release evidence. Deployment is a separate manual workflow." \
            "$RUNNER_TEMP/release-record.tar.gz" "$RUNNER_TEMP/release-record.sha256"
      - name: Upload temporary diagnostic scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ needs.preflight.outputs.source-sha }}
          path: |
            WorkCard-Lifecycle/docs/release/manifests/${{ needs.preflight.outputs.source-sha }}.json
            WorkCard-Lifecycle/.quality-results/release/image-vulnerabilities.json
            WorkCard-Lifecycle/.quality-results/release/published-identity.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
