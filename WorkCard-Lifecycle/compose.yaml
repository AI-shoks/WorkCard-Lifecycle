name: production-work-card-foundation

services:
  db:
    image: postgres:18.1-bookworm
    environment:
      POSTGRES_DB: workcard
      POSTGRES_USER: workcard_migrator
      POSTGRES_PASSWORD: ${WORKCARD_POSTGRES_PASSWORD:?set WORKCARD_POSTGRES_PASSWORD in .env}
      WORKCARD_APP_DATABASE_PASSWORD: ${WORKCARD_APP_DATABASE_PASSWORD:?set WORKCARD_APP_DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/bootstrap/01-create-application-role.sh:/docker-entrypoint-initdb.d/01-create-application-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workcard_migrator -d workcard"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [application]

  migrate:
    build:
      context: .
    command: ["python", "-m", "workcard_api.migrations", "up"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [application]

  api:
    build:
      context: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks: [application]

networks:
  application:
    internal: true

volumes:
  postgres-data:
