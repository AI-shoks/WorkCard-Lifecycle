name: work-card-lifecycle

x-application-image: &application-image
  image: work-card-lifecycle:local
  build:
    context: .
    target: runtime

x-application-security: &application-security
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-owner-environment: &owner-environment
  APP_DATABASE_USER: ${APP_DATABASE_USER:-workcard_app}
  APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-workcard_app_local}
  MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-workcard_owner}:${POSTGRES_PASSWORD:-workcard_owner_local}@database:5432/${POSTGRES_DB:-workcard}

services:
  database:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workcard}
      POSTGRES_USER: ${POSTGRES_USER:-workcard_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workcard_owner_local}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55439}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 20s

  migrate:
    <<: [*application-image, *application-security]
    command: ['node', 'dist/migrate.js']
    environment:
      <<: *owner-environment
      NODE_ENV: production
    depends_on:
      database:
        condition: service_healthy
    restart: 'no'

  seed:
    <<: [*application-image, *application-security]
    command: ['node', 'dist/seed.js']
    environment:
      <<: *owner-environment
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  app:
    <<: [*application-image, *application-security]
    environment:
      APP_DATABASE_USER: ${APP_DATABASE_USER:-workcard_app}
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ORIGIN: ${COMPOSE_APP_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${APP_DATABASE_USER:-workcard_app}:${APP_DATABASE_PASSWORD:-workcard_app_local}@database:5432/${POSTGRES_DB:-workcard}
      DEMO_MAX_BATCHES: ${DEMO_MAX_BATCHES:-20}
      DEMO_MAX_SESSIONS: ${DEMO_MAX_SESSIONS:-500}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      PORT: 3000
      PROXY_TRUST_MODE: none
      SESSION_SIGNING_SECRET: ${SESSION_SIGNING_SECRET:-local-compose-session-secret-change-me}
      WEB_DIST_PATH: /opt/work-card/public
    ports:
      - 127.0.0.1:${PORT:-3000}:3000
    depends_on:
      seed:
        condition: service_completed_successfully
    stop_grace_period: 10s

volumes:
  postgres-data:
    name: work-card-lifecycle-postgres
