[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "production-work-card-workflow"
version = "0.1.0"
description = "Synthetic portfolio MVP for production work-card workflow"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.0",
  "itsdangerous==2.2.0",
  "prometheus-client==0.22.1",
  "psycopg[binary]==3.2.9",
  "psycopg-pool==3.3.1",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "starlette==1.3.1",
  "uvicorn==0.34.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra --cov=workcard_api --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires a real PostgreSQL database",
]

[tool.coverage.run]
branch = true
source = ["workcard_api"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["workcard_api"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "psycopg_pool.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B104"]
